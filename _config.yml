# Book settings
title: Python for AI Coders
author: AI Coder Community
logo: ""
copyright: "2025"

# Force re-execution of notebooks on each build
execute:
  execute_notebooks: auto

# Exclude patterns - don't scan these folders
exclude_patterns:
  - venv/**
  - _build/**
  - "**.ipynb_checkpoints"
  - nul
  - jep.py

# Launch buttons for interactive code
launch_buttons:
  thebe: true
  notebook: true
  binderhub_url: "https://mybinder.org"

# Repository settings
repository:
  url: https://github.com/LaskosVirtuals/PythonCourse
  path_to_book: ""
  branch: main

# HTML settings
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: false
  home_page_in_navbar: true
  extra_css:
    - _static/custom.css
  extra_footer: |
    <p>
    A top-down Python course designed for AI coders
    </p>

# Parse settings
parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - dollarmath
    - linkify
    - substitution

# Sphinx configuration for Thebe
sphinx:
  config:
    thebe_config:
      repository_url: https://github.com/LaskosVirtuals/PythonCourse
      repository_branch: main
